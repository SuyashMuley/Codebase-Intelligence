# A starting point for scraping this project locally (docker compose --profile observability up).
# In production, point the targets at the deployed API and worker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cip-api
    metrics_path: /metrics
    # The same value as the API's METRICS_TOKEN, in a file next to this one (gitignored).
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: cip-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["host.docker.internal:9100"] # WORKER_HTTP_PORT
