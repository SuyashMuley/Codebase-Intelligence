# Weekly update pull requests for every dependency this project ships or builds with. They go
# through the normal CI, including the security checks.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
