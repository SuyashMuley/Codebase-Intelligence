[project]
name = "codebase-intelligence-backend"
version = "0.1.0"
description = "Codebase Intelligence Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "cryptography>=43",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    "langgraph>=1.2.22",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: requires a reachable Postgres with pgvector"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.bandit]
# Static security checks on the application code (CI: `bandit -r app -c pyproject.toml`).
# B101 (assert) is skipped on purpose: asserts here only narrow types for mypy (checked in strict
# mode) and none guards a security decision; those are explicit `raise`s.
skips = ["B101"]

[tool.ruff.lint.per-file-ignores]
"loadtest/*" = ["E501"]  # long SQL and shell strings in the measurement scripts
