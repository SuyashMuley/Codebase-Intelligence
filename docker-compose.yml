services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: cip
      POSTGRES_DB: cip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip -d cip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cip:cip@db:5432/cip
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      # Optional. Read from your shell or a root-level .env file (gitignored).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLIENT_KEY_SALT: ${CLIENT_KEY_SALT:-dev-salt-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
