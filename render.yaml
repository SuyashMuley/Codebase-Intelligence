# Render Blueprint: the API only. The frontend goes on Vercel and the database on Neon.
# Setup, in order, is in docs/DEPLOYMENT.md. Variables marked `sync: false` are asked for in
# the Render dashboard the first time the blueprint is applied and are never stored in git.
services:
  - type: web
    name: cip-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production # the API refuses to start unless the auth settings below are valid
      - key: LOG_LEVEL
        value: INFO
      # Neon: the POOLED connection string (host contains "-pooler") for the app...
      - key: DATABASE_URL
        sync: false
      # ...and the DIRECT one for migrations, which run on every start.
      - key: ALEMBIC_DATABASE_URL
        sync: false
      # Your Vercel URL, no trailing slash. Used for the OAuth callback and redirects.
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false # the same Vercel URL
      - key: COOKIE_SECURE
        value: "true"
      - key: FORWARDED_FOR_HOPS
        value: "1" # Render's proxy; never trust X-Forwarded-For without it
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_KEY_SALT
        generateValue: true
      # Must be 32 random bytes, url-safe base64: Render's generated values are not that.
      #   python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional second chat provider, used when OpenRouter is limited or down (public repos only).
      - key: GROQ_API_KEY
        sync: false
      # Optional: lets the scheduled workflow purge expired private data (see DEPLOYMENT.md).
      - key: MAINTENANCE_TOKEN
        generateValue: true
      - key: GITHUB_APP_SLUG
        sync: false
      # Lets a monitoring system read /metrics (see docs/DEPLOYMENT.md). Copy the value from here.
      - key: METRICS_TOKEN
        generateValue: true

  # A background worker lets indexing finish with no browser tab open. Render's free plan has no
  # background workers, so this stays commented out until you are on a paid plan. It must have the
  # same environment variables as cip-api (use an environment group, or copy them), and it runs the
  # same image with a different command. Any number of workers may run next to the API.
  #
  # - type: worker
  #   name: cip-worker
  #   runtime: docker
  #   plan: starter
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: ./backend
  #   dockerCommand: python -m app.worker
  #   envVars:
  #     - fromGroup: cip-shared
